name: Windows release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v0.1.0
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m pytest -q
      - run: python -m PyInstaller --noconfirm --clean --windowed --name QianchuanAgent --collect-all playwright app.py
      - shell: pwsh
        run: |
          Copy-Item install.ps1,安装.cmd,README.md dist/
          Compress-Archive -Path dist/* -DestinationPath QianchuanAgent-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: QianchuanAgent-Windows-x64
          path: QianchuanAgent-Windows-x64.zip
      - name: Publish preview installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG QianchuanAgent-Windows-x64.zip --clobber
          } else {
            gh release create $env:RELEASE_TAG QianchuanAgent-Windows-x64.zip --target main --prerelease --title $env:RELEASE_TAG --notes "Windows preview. See README for migration and validation limits."
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
